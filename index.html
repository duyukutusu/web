    <style>
        :root {
            --primary: #1a252f; /* Koyu Lacivert (Otorite) */
            --accent: #d4af37; /* Altın Sarısı (Başarı/Birincilik) */
            --bg-color: #fdfbf7; /* Kırık Beyaz (Premium Kağıt Hissi) */
            --text-color: #333;
            --white: #ffffff;
            --gray: #7f8c8d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* NAVBAR & HEADER */
        header {
            padding: 20px 0;
            background: transparent;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .expert-title {
            font-size: 0.85rem;
            color: var(--gray);
            font-weight: 500;
            text-align: right;
        }

        @media (max-width: 600px) {
            .header-content { justify-content: center; text-align: center; }
            .expert-title { text-align: center; }
        }

        /* HERO SECTION */
        .hero {
            padding: 60px 0 80px 0;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .sub-text {
            font-size: 1.1rem;
            color: #555;
            max-width: 700px;
            margin: 0 auto 50px auto;
        }

        .highlight {
            color: var(--accent);
            font-style: italic;
        }

        /* KART YAPISI (İKİ KAPI) */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--white);
            border-radius: 15px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
            text-align: left;
            position: relative;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .card-header {
            margin-bottom: 20px;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .card p {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .features-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .features-list li {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features-list i {
            color: var(--accent);
            font-size: 0.8rem;
        }

        /* PREMIUM KART ÖZELLEŞTİRMELERİ */
        .premium-card {
            border-top: 4px solid var(--primary);
        }
        .premium-card .card-icon { color: var(--primary); }
        
        /* FREE KART ÖZELLEŞTİRMELERİ */
        .free-card {
            border-top: 4px solid var(--accent);
        }
        .free-card .card-icon { color: var(--accent); }

        .badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: var(--white);
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-free {
            background: var(--accent);
            color: var(--primary);
        }

        /* BUTONLAR */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }
        .btn-primary:hover {
            background-color: #121a21;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--accent);
            color: #b89324;
        }
        .btn-outline:hover {
            background-color: var(--accent);
            color: var(--white);
        }
